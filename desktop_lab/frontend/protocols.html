<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Протоколы</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>
  <style>
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-top: 1px solid var(--sidebar-border);
      margin-top: auto;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }
    .user-details {
      flex: 1;
      min-width: 0;
    }
    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--sidebar-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-role {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: none;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      font-size: 12px;
      font-weight: 600;
    }
    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fef2f2;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🧪 ЛабСистема</h1>
        <p>Лабораторная система</p>
      </div>
      <nav>
        <ul class="nav">
          <li class="nav-item" data-requires-role="technician,engineer,admin"><a href="/protocol-create.html" class="nav-link">📝 Новый протокол</a></li>
          <li class="nav-item"><a href="/protocols.html" class="nav-link">📋 Протоколы</a></li>
          <li class="nav-item" data-requires-role="technician,engineer,admin"><a href="/groups.html" class="nav-link">🗂️ Группы</a></li>
          <li class="nav-item" data-requires-role="engineer,admin"><a href="/organizations.html" class="nav-link">🏢 Организации</a></li>
          <li class="nav-item" style="margin-top: auto; border-top: 1px solid var(--sidebar-border); padding-top: 10px;">
            <a href="/settings.html" class="nav-link">⚙️ Настройки</a>
          </li>
          <li class="nav-item" style="margin-top: 16px; border-top: 1px solid var(--sidebar-border); padding-top: 10px;">
            <button id="theme-toggle" onclick="toggleTheme()" class="nav-link" style="background:none;border:none;color:inherit;cursor:pointer;width:100%;" title="Переключить тему">🌙</button>
          </li>
        </ul>
        <!-- Информация о пользователе -->
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">?</div>
          <div class="user-details">
            <div class="user-name" id="userName">Гость</div>
            <div class="user-role" id="userRole">—</div>
          </div>
          <button class="logout-btn" onclick="logout()" title="Выйти">🚪</button>
        </div>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="page-header">
        <h2 class="page-title">📋 Протоколы</h2>
        <button class="btn btn-primary" onclick="window.location.href='/protocol-create.html'" data-requires-role="technician,engineer,admin">
          + Новый протокол
        </button>
      </header>

      <!-- Фильтры -->
      <div class="card">
        <div class="form-grid">
          <div class="form-row-3">
            <div class="form-group">
              <label>Статус</label>
              <select id="filterStatus">
                <option value="">Все</option>
                <option value="draft">Черновики</option>
                <option value="completed">Завершённые</option>
              </select>
            </div>
            <div class="form-group">
              <label>Поиск по № протокола</label>
              <input type="text" id="searchProtocolId" placeholder="Например: П-123/2024">
            </div>
            <div class="form-group">
              <label>Поиск по лаборатории</label>
              <input type="text" id="searchLab" placeholder="Название лаборатории...">
            </div>
          </div>
          <div class="form-row-2" style="margin-top: 16px;">
            <div class="form-group">
              <label>Дата испытания с</label>
              <input type="date" id="filterStartDate">
            </div>
            <div class="form-group">
              <label>Дата испытания по</label>
              <input type="date" id="filterEndDate">
            </div>
          </div>
        </div>
      </div>

      <!-- Таблица -->
      <section class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>№ Протокола</th>
                <th>Дата</th>
                <th>Лаборатория</th>
                <th>Проба</th>
                <th>Статус</th>
                <th data-requires-role="technician,engineer,admin">Действия</th>
              </tr>
            </thead>
            <tbody id="protocolsTable">
              <tr><td colspan="6" class="text-center">Загрузка...</td></tr>
            </tbody>
          </table>
        </div>
        
        <!-- Пагинация -->
        <div class="flex justify-between items-center mt-4">
          <button id="prevPage" class="btn btn-secondary btn-small" disabled>← Назад</button>
          <span id="pageInfo" class="text-muted">Страница 1</span>
          <button id="nextPage" class="btn btn-secondary btn-small">Вперёд →</button>
        </div>
      </section>
    </main>
  </div>

    <!-- Modal: Edit Protocol -->
  <div id="editModal" class="modal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h3>✏️ Редактирование протокола</h3>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" id="editProtocolId">
          
          <div class="form-grid">
            <!-- Группа -->
            <div class="form-row-3">
              <div class="form-group">
                <label>Группа испытаний</label>
                <select id="editGroupSelect">
                  <option value="">-- Без группы --</option>
                </select>
              </div>
              
              <!-- Лаборатория -->
              <div class="form-group">
                <label>Лаборатория <span class="required">*</span></label>
                <input type="text" id="editLabName" required>
              </div>
              
              <!-- Оператор -->
              <div class="form-group">
                <label>Оператор <span class="required">*</span></label>
                <input type="text" id="editOperatorName" required>
              </div>
            </div>
            
            <div class="form-row-3" style="margin-top: 16px;">
              <!-- Дата испытания -->
              <div class="form-group">
                <label>Дата испытания</label>
                <input type="date" id="editTestDate">
              </div>
              
              <!-- Номер пробы -->
              <div class="form-group">
                <label>Номер пробы <span class="required">*</span></label>
                <input type="text" id="editSampleNumber" required>
              </div>
              
              <!-- Место отбора -->
              <div class="form-group">
                <label>Место отбора <span class="required">*</span></label>
                <input type="text" id="editCollectionPlace" required>
              </div>
            </div>
            
            <div class="form-row-2" style="margin-top: 16px;">
              <!-- Дата отбора -->
              <div class="form-group">
                <label>Дата отбора</label>
                <input type="date" id="editCollectionDate">
              </div>
              
              <!-- Заметка -->
              <div class="form-group">
                <label>Заметка</label>
                <textarea id="editNote" rows="3" placeholder="Дополнительная информация..."></textarea>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeEditModal()">Отмена</button>
        <button id="editSaveBtn" class="btn btn-primary" onclick="saveProtocolEdit()">💾 Сохранить изменения</button>
      </div>
    </div>
  </div>

  <!-- Modal: Просмотр протокола -->
  <div id="viewModal" class="modal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h3>Просмотр протокола</h3>
        <button class="modal-close" onclick="closeViewModal()">&times;</button>
      </div>
      <div class="modal-body">
        <!-- 🔥 Блок заметок протокола и пробы -->
        <div id="viewNotes" class="notes-section mb-4"></div>
        
        <!-- Основная информация -->
        <div id="viewInfo" class="info-grid mb-4"></div>
        
        <!-- Результаты испытаний -->
        <h4 class="mb-3">📊 Результаты испытаний</h4>
        <div id="viewResults"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeViewModal()">Закрыть</button>
        <button class="btn btn-primary" id="viewDownloadBtn">📥 Скачать PDF</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { auth } from './js/auth.js';
    import { showToast } from './js/utils.js';
    
    // Проверка аутентификации и инициализация UI
    document.addEventListener('DOMContentLoaded', async () => {
      const isValid = await auth.init();
      
      if (!isValid) {
        window.location.href = '/login.html';
        return;
      }
      
      // Обновляем информацию о пользователе в sidebar
      const userInfo = auth.getUserInfo();
      if (userInfo) {
        const userNameEl = document.getElementById('userName');
        const userRoleEl = document.getElementById('userRole');
        const userAvatarEl = document.getElementById('userAvatar');
        
        if (userNameEl) userNameEl.textContent = userInfo.name || userInfo.email;
        if (userRoleEl) userRoleEl.textContent = auth.getRoleDisplayName(userInfo.role);
        if (userAvatarEl) {
          const initial = (userInfo.name || userInfo.email || '?')[0].toUpperCase();
          userAvatarEl.textContent = initial;
        }
      }
    });
    
    // Функция выхода
    window.logout = async () => {
      await auth.logout();
    };
  </script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/navigation.js"></script>
  <script type="module" src="js/protocols.js"></script>
</body>
</html>
