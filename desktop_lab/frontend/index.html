<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛабСистема — Лабораторная система</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module">
    // Редирект на страницу протоколов после проверки авторизации
    import { auth } from './js/auth.js';
    
    if (!auth.isAuthenticated()) {
      window.location.href = '/login.html';
    } else {
      auth.init();
      const role = auth.getRole();
      
      // RBAC: Клиенты не имеют доступа к созданию протоколов
      if (role === 'client') {
        window.location.href = '/protocols.html';
      } else {
        window.location.href = '/protocols.html';
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🧪 ЛабСистема</h1>
        <p>Лабораторная система</p>
      </div>
      <nav>
        <ul class="nav">
          <li class="nav-item" data-requires-role="technician,engineer,admin"><a href="/protocol-create.html" class="nav-link">📝 Новый протокол</a></li>
          <li class="nav-item"><a href="/protocols.html" class="nav-link">📋 Протоколы</a></li>
          <li class="nav-item" data-requires-role="technician,engineer,admin"><a href="/groups.html" class="nav-link">🗂️ Группы</a></li>
          <li class="nav-item" data-requires-role="engineer,admin"><a href="/organizations.html" class="nav-link">🏢 Организации</a></li>
          <li class="nav-item" style="margin-top: auto; border-top: 1px solid var(--sidebar-border); padding-top: 10px;">
            <a href="/settings.html" class="nav-link">⚙️ Настройки</a>
          </li>
        </ul>
      </nav>
    </aside>
    <main class="main">
      <div class="card text-center" style="padding: 40px;">
        <h2>Загрузка...</h2>
        <p class="text-muted">Перенаправляем на страницу протоколов</p>
      </div>
    </main>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
