<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — ЛабСистема</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-gradient);
    }
    .auth-card {
      background: var(--card);
      padding: 40px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--border);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .role-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .role-option {
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: var(--card);
      position: relative;
    }
    .role-option:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .role-option.selected {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .role-option .role-icon {
      font-size: 24px;
      display: block;
      margin-bottom: 6px;
    }
    .role-description {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 400;
    }
    .role-option.selected .role-description {
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🧪 ЛабСистема</h1>
        <p>Регистрация нового пользователя</p>
      </div>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="name">ФИО <span class="required">*</span></label>
          <input type="text" id="name" name="name" required placeholder="Иванов Иван Иванович">
        </div>
        
        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>
        
        <div class="form-group">
          <label for="password">Пароль <span class="required">*</span></label>
          <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••">
        </div>
        
        <div class="form-group">
          <label>Роль в системе <span class="required">*</span></label>
          <div class="role-selector">
            <div class="role-option" data-role="technician">
              <span class="role-icon">🔧</span>
              <span>Техник</span>
              <div class="role-description">Создание проб, выполнение тестов</div>
            </div>
            <div class="role-option" data-role="engineer">
              <span class="role-icon">⚙️</span>
              <span>Инженер</span>
              <div class="role-description">Протоколы, стандарты, отчеты</div>
            </div>
            <div class="role-option" data-role="admin">
              <span class="role-icon">👑</span>
              <span>Админ</span>
              <div class="role-description">Полный доступ ко всем функциям</div>
            </div>
            <div class="role-option" data-role="client">
              <span class="role-icon">👤</span>
              <span>Клиент</span>
              <div class="role-description">Просмотр своих протоколов</div>
            </div>
          </div>
          <input type="hidden" id="role" name="role" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Зарегистрироваться
        </button>
      </form>
      
      <div class="auth-footer">
        <p>Уже есть аккаунт? <a href="/login.html">Войти</a></p>
      </div>
    </div>
  </div>
  
  <script type="module">
    import { showToast } from './js/utils.js';
    
    // Выбор роли
    const roleOptions = document.querySelectorAll('.role-option');
    const roleInput = document.getElementById('role');
    
    roleOptions.forEach(option => {
      option.addEventListener('click', () => {
        roleOptions.forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        roleInput.value = option.dataset.role;
      });
    });
    
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      
      if (!role) {
        showToast('Выберите роль', true);
        return;
      }
      
      try {
        const response = await fetch('/api/v1/auth/sign-up', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.message || err.error || 'Ошибка регистрации');
        }
        
        showToast('Регистрация успешна! Теперь войдите.', false);
        
        // Редирект на страницу входа через 1 секунду
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1000);
        
      } catch (error) {
        console.error('Registration error:', error);
        showToast(error.message, true);
      }
    });
  </script>
</body>
</html>
