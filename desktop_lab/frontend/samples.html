<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Образцы - ЛабСистема</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>
  <style>
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-top: 1px solid var(--sidebar-border);
      margin-top: auto;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }
    .user-details {
      flex: 1;
      min-width: 0;
    }
    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--sidebar-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-role {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: none;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      font-size: 12px;
      font-weight: 600;
    }
    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fef2f2;
    }
    .sample-photo-preview {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: var(--radius-md);
      border: 2px solid var(--border);
    }
    .sample-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }
    .sample-card:hover {
      box-shadow: var(--shadow-md);
    }
    .sample-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .sample-number {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .sample-actions {
      display: flex;
      gap: 8px;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
    }
    .sample-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .detail-item {
      background: var(--bg-secondary);
      padding: 12px;
      border-radius: var(--radius-md);
    }
    .detail-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 600;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .close-modal {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🧪 ЛабСистема</h1>
        <p>Лабораторная система</p>
      </div>
      <nav>
        <ul class="nav">
          <li class="nav-item" data-requires-role="technician,engineer,admin"><a href="/protocol-create.html" class="nav-link">📝 Новый протокол</a></li>
          <li class="nav-item"><a href="/protocols.html" class="nav-link">📋 Протоколы</a></li>
          <li class="nav-item" data-requires-role="technician,engineer,admin"><a href="/groups.html" class="nav-link">🗂️ Группы</a></li>
          <li class="nav-item" data-requires-role="technician,engineer,admin"><a href="/samples.html" class="nav-link active">🧫 Образцы</a></li>
          <li class="nav-item" data-requires-role="engineer,admin"><a href="/organizations.html" class="nav-link">🏢 Организации</a></li>
          <li class="nav-item" style="margin-top: auto; border-top: 1px solid var(--sidebar-border); padding-top: 10px;">
            <a href="/settings.html" class="nav-link">⚙️ Настройки</a>
          </li>
          <li class="nav-item" style="margin-top: 16px; border-top: 1px solid var(--sidebar-border); padding-top: 10px;">
            <button id="theme-toggle" onclick="toggleTheme()" class="nav-link" style="background:none;border:none;color:inherit;cursor:pointer;width:100%;" title="Переключить тему">🌙</button>
          </li>
        </ul>
        <!-- Информация о пользователе -->
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">?</div>
          <div class="user-details">
            <div class="user-name" id="userName">Гость</div>
            <div class="user-role" id="userRole">—</div>
          </div>
          <button class="logout-btn" onclick="logout()" title="Выйти">🚪</button>
        </div>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="page-header">
        <h2 class="page-title">🧫 Образцы</h2>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Новый образец</button>
      </header>

      <!-- Фильтры -->
      <div class="card mb-4">
        <div class="form-row-2">
          <div class="form-group">
            <label>Группа</label>
            <select id="filterGroup">
              <option value="">Все группы</option>
            </select>
          </div>
          <div class="form-group">
            <label>Материал</label>
            <select id="filterMaterial">
              <option value="">Все материалы</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2" style="margin-top: 16px;">
          <button class="btn btn-secondary" onclick="applyFilters()">🔍 Применить фильтры</button>
          <button class="btn btn-secondary" onclick="resetFilters()">🔄 Сбросить</button>
        </div>
      </div>

      <!-- Список образцов -->
      <div id="samplesContainer" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;">
        <!-- Карточки образцов будут загружены здесь -->
      </div>
    </main>
  </div>

  <!-- Модальное окно создания/редактирования образца -->
  <div class="modal-overlay" id="sampleModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Новый образец</h3>
        <button class="close-modal" onclick="closeModal()">&times;</button>
      </div>
      
      <form id="sampleForm">
        <input type="hidden" id="sampleId">
        
        <div class="form-row-2">
          <div class="form-group">
            <label>Номер образца <span class="required">*</span></label>
            <input type="text" id="sampleNumber" required placeholder="П-001">
          </div>
          <div class="form-group">
            <label>Материал <span class="required">*</span></label>
            <select id="materialSelect" required>
              <option value="">-- Выберите материал --</option>
            </select>
          </div>
        </div>
        
        <div class="form-row-2" style="margin-top: 16px;">
          <div class="form-group">
            <label>Группа</label>
            <select id="groupSelect">
              <option value="">-- Без группы --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Место отбора</label>
            <input type="text" id="collectionPlace" placeholder="Объект №5">
          </div>
        </div>
        
        <div class="form-row-2" style="margin-top: 16px;">
          <div class="form-group">
            <label>Дата отбора</label>
            <input type="date" id="collectionDate">
          </div>
          <div class="form-group">
            <label>Заметка</label>
            <input type="text" id="note" placeholder="Примечание...">
          </div>
        </div>
        
        <h4 style="font-size: 14px; font-weight: 600; margin: 20px 0 12px; color: var(--text-muted);">📐 Параметры образца</h4>
        
        <div class="form-row-4">
          <div class="form-group">
            <label>Длина (мм)</label>
            <input type="number" step="0.01" id="lengthMM" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Ширина (мм)</label>
            <input type="number" step="0.01" id="widthMM" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Высота (мм)</label>
            <input type="number" step="0.01" id="heightMM" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Вес (г)</label>
            <input type="number" step="0.01" id="weightGrams" placeholder="0.00">
          </div>
        </div>
        
        <div class="form-row-4" style="margin-top: 16px;">
          <div class="form-group">
            <label>Форма</label>
            <select id="shape">
              <option value="">-- Выберите форму --</option>
              <option value="cube">Куб</option>
              <option value="cylinder">Цилиндр</option>
              <option value="prism">Призма</option>
              <option value="sphere">Сфера</option>
              <option value="irregular">Неправильная</option>
            </select>
          </div>
          <div class="form-group">
            <label>Цвет</label>
            <input type="text" id="color" placeholder="Серый">
          </div>
          <div class="form-group">
            <label>Номер партии</label>
            <input type="text" id="batchNumber" placeholder="BATCH-001">
          </div>
          <div class="form-group">
            <label>Производитель</label>
            <input type="text" id="manufacturer" placeholder="ООО Пример">
          </div>
        </div>
        
        <div class="form-group" style="margin-top: 16px;">
          <label>URL фотографии</label>
          <input type="url" id="photoURL" placeholder="https://example.com/photo.jpg">
        </div>
        
        <div class="form-group" style="margin-top: 16px;">
          <label>Заметка</label>
          <textarea id="note" rows="3" placeholder="Дополнительная информация..."></textarea>
        </div>
        
        <div class="flex justify-between mt-4">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
          <button type="submit" class="btn btn-primary">💾 Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { auth } from './js/auth.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      const isValid = await auth.init();
      
      if (!isValid) {
        window.location.href = '/login.html';
        return;
      }
      
      const role = auth.getRole();
      if (role === 'client') {
        // Клиенты могут только просматривать образцы
        const createBtn = document.querySelector('button[onclick="openCreateModal()"]');
        if (createBtn) createBtn.style.display = 'none';
      }
      
      const userInfo = auth.getUserInfo();
      if (userInfo) {
        const userNameEl = document.getElementById('userName');
        const userRoleEl = document.getElementById('userRole');
        const userAvatarEl = document.getElementById('userAvatar');
        
        if (userNameEl) userNameEl.textContent = userInfo.name || userInfo.email;
        if (userRoleEl) userRoleEl.textContent = auth.getRoleDisplayName(userInfo.role);
        if (userAvatarEl) {
          const initial = (userInfo.name || userInfo.email || '?')[0].toUpperCase();
          userAvatarEl.textContent = initial;
        }
      }
      
      await loadMaterials();
      await loadGroups();
      await loadSamples();
    });
    
    window.logout = async () => {
      await auth.logout();
    };
  </script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/navigation.js"></script>
  <script type="module" src="js/samples.js"></script>
</body>
</html>
