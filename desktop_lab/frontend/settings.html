<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>
  <style>
    .settings-card { max-width: 600px; margin: 0 auto; }
    .db-path { 
      background: #f8f9fa; padding: 10px; border-radius: 4px; 
      font-family: monospace; word-break: break-all; margin: 10px 0;
    }
    .status { margin-top: 10px; padding: 8px; border-radius: 4px; display: none; }
    .status.show { display: block; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #d1ecf1; color: #0c5460; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-top: 1px solid var(--sidebar-border);
      margin-top: auto;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }
    .user-details {
      flex: 1;
      min-width: 0;
    }
    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--sidebar-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-role {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: none;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      font-size: 12px;
      font-weight: 600;
    }
    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fef2f2;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🧪 ЛабСистема</h1>
        <p>Лабораторная система</p>
      </div>
      <nav>
         <ul class="nav">
          <li class="nav-item" data-requires-role="technician,engineer,admin"><a href="/protocol-create.html" class="nav-link">📝 Новый протокол</a></li>
          <li class="nav-item"><a href="/protocols.html" class="nav-link">📋 Протоколы</a></li>
          <li class="nav-item" data-requires-role="technician,engineer,admin"><a href="/groups.html" class="nav-link">🗂️ Группы</a></li>
          <li class="nav-item" data-requires-role="engineer,admin"><a href="/organizations.html" class="nav-link">🏢 Организации</a></li>
          <li class="nav-item" style="margin-top: auto; border-top: 1px solid var(--sidebar-border); padding-top: 10px;">
            <a href="/settings.html" class="nav-link active">⚙️ Настройки</a>
          </li>
          <li class="nav-item" style="margin-top: 16px; border-top: 1px solid var(--sidebar-border); padding-top: 10px;">
            <button id="theme-toggle" onclick="toggleTheme()" class="nav-link" style="background:none;border:none;color:inherit;cursor:pointer;width:100%;" title="Переключить тему">🌙</button>
          </li>
        </ul>
        <!-- Информация о пользователе -->
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">?</div>
          <div class="user-details">
            <div class="user-name" id="userName">Гость</div>
            <div class="user-role" id="userRole">—</div>
          </div>
          <button class="logout-btn" onclick="logout()" title="Выйти">🚪</button>
        </div>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <div class="card settings-card" style="padding: 30px;">
        <h2>⚙️ Настройки приложения</h2>
        
        <!-- Блок управления БД -->
        <div class="form-group" style="margin: 25px 0;">
          <label><strong>🗄️ Подключение к базе данных</strong></label>
          <p class="text-muted" style="font-size: 0.9em;">
            Выберите файл SQLite (.db или .sqlite) для хранения данных лаборатории.
          </p>
          
          <div class="db-path" id="db-path">
            Загрузка пути...
          </div>
          
          <button id="btn-select-db" class="btn btn-primary" style="width: 100%;">
            📁 Выбрать файл базы данных
          </button>
          
          <div id="db-status" class="status"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    const btn = document.getElementById('btn-select-db');
    const status = document.getElementById('db-status');
    const pathEl = document.getElementById('db-path');

    // Загрузка информации о текущей БД
    async function loadDBInfo() {
      try {
        const res = await fetch('/api/v1/db/info');
        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        pathEl.textContent = data.current_path || 'База данных не выбрана';
        if (data.current_path && !data.exists) {
          showStatus('⚠️ Файл не найден по указанному пути', 'info');
        }
      } catch (e) {
        console.warn('DB info load failed', e);
        pathEl.textContent = 'Ошибка загрузки';
      }
    }

    // Обработчик кнопки выбора
    btn?.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = '⏳ Ожидание выбора...';
      hideStatus();
      
      try {
        const res = await fetch('/api/v1/db/select', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ allow_create: true })
        });
        
        const result = await res.json();
        
        switch (result.status) {
          case 'success':
            showStatus('✅ ' + result.message, 'success');
            pathEl.textContent = result.path;
            // Опционально: перезагрузить приложение через 1.5 сек для применения изменений
            setTimeout(() => window.location.reload(), 1500);
            break;
          case 'cancelled':
            showStatus('ℹ️ Выбор отменён', 'info');
            break;
          default:
            throw new Error(result.message || result.error || 'Неизвестная ошибка');
        }
      } catch (err) {
        console.error('DB selection failed:', err);
        showStatus('❌ ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '📁 Выбрать файл базы данных';
        loadDBInfo();
      }
    });

    // Утилиты для отображения статусов
    function showStatus(msg, type) {
      status.textContent = msg;
      status.className = `status show ${type}`;
    }
    function hideStatus() {
      status.className = 'status';
    }

    // Инициализация
    loadDBInfo();
  </script>
  
  <script type="module">
    import { auth } from './js/auth.js';
    
    // Проверка аутентификации и прав доступа
    document.addEventListener('DOMContentLoaded', async () => {
      const isValid = await auth.init();
      
      if (!isValid) {
        window.location.href = '/login.html';
        return;
      }
      
      // Обновляем информацию о пользователе в sidebar
      const userInfo = auth.getUserInfo();
      if (userInfo) {
        const userNameEl = document.getElementById('userName');
        const userRoleEl = document.getElementById('userRole');
        const userAvatarEl = document.getElementById('userAvatar');
        
        if (userNameEl) userNameEl.textContent = userInfo.name || userInfo.email;
        if (userRoleEl) userRoleEl.textContent = auth.getRoleDisplayName(userInfo.role);
        if (userAvatarEl) {
          const initial = (userInfo.name || userInfo.email || '?')[0].toUpperCase();
          userAvatarEl.textContent = initial;
        }
      }
    });
    
    // Функция выхода
    window.logout = async () => {
      await auth.logout();
    };
  </script>
</body>
</html>
