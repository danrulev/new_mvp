auth:
  access_token_ttl: 15m
  refresh_token_ttl: 30m
  jwt_secret: "secret"

db:
  allow_selection: true

server:
  host: localhost
  port: 8080
  max_header_bytes:  1048576
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 120s

logger:
  level: debug
  development: true
  disable_caller: true
  disable_stacktrace: true
  encoding: json
  output_paths: stderr
  error_output_paths: stderr